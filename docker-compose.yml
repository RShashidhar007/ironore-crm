# ============================================================
# docker-compose.yml - IronOre CRM Application
# ============================================================
# Single container with both backend and frontend
# Connects to external SQL Server database
# ============================================================

version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: ironore-crm-app
    
    ports:
      - "8000:8000"    # FastAPI Backend
      - "5000:5000"    # Frontend (static)
    
    environment:
      # --- Database Configuration ---
      # Set to sqlite for containerized dev, or mssql for production
      DB_MODE: ${DB_MODE:-mssql}
      
      # SQLite (used if DB_MODE=sqlite)
      SQLITE_PATH: ${SQLITE_PATH:-./customer_db.sqlite3}
      
      # SQL Server (used if DB_MODE=mssql)
      MSSQL_SERVER: ${MSSQL_SERVER}
      MSSQL_PORT: ${MSSQL_PORT}
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_DRIVER: ${MSSQL_DRIVER:-ODBC Driver 18 for SQL Server}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-no}
      MSSQL_TRUST_SERVER_CERT: ${MSSQL_TRUST_SERVER_CERT:-yes}
      
      # --- Authentication ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      
      # --- Ollama (AI) ---
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      
      # --- Company Contact ---
      COMPANY_WHATSAPP_NUMBER: ${COMPANY_WHATSAPP_NUMBER}
      COMPANY_SUPPORT_EMAIL: ${COMPANY_SUPPORT_EMAIL}
      COMPANY_SUPPORT_PHONE: ${COMPANY_SUPPORT_PHONE}
      
      # --- CORS ---
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5000}
    
    volumes:
      # Optional: Mount for SQLite database persistence
      - ./data:/app/data
    
    networks:
      - crm-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  crm-network:
    driver: bridge

volumes:
  data:
    driver: local
