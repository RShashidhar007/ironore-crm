<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronOre CRM - Chatbot Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Chat Widget Styles */
        .chat-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c4622d 0%, #8b4513 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(196, 98, 45, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .chat-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(196, 98, 45, 0.4);
        }

        .chat-fab:active {
            transform: scale(0.95);
        }

        .chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 420px;
            max-height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            z-index: 999;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            background: linear-gradient(135deg, #c4622d 0%, #8b4513 100%);
            color: white;
            padding: 16px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-sub {
            font-size: 12px;
            opacity: 0.9;
        }

        .btn-ghost {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            font-size: 20px;
        }

        .btn-ghost:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #fafafa;
        }

        .msg-row {
            display: flex;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #c4622d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
        }

        .msg-bot {
            background: #e8e8e8;
            color: #333;
        }

        .msg-user {
            background: #c4622d;
            color: white;
            margin-left: auto;
        }

        .msg-row-user {
            justify-content: flex-end;
        }

        .chat-input-row {
            padding: 12px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            border-radius: 0 0 12px 12px;
        }

        textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            max-height: 100px;
            outline: none;
        }

        textarea:focus {
            border-color: #c4622d;
            box-shadow: 0 0 0 2px rgba(196, 98, 45, 0.1);
        }

        .btn-primary {
            background: #c4622d;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            background: #a85028;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(196, 98, 45, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .chat-window {
                width: 100%;
                max-height: 100%;
                bottom: 0;
                right: 0;
                border-radius: 0;
            }

            .chat-fab {
                bottom: 16px;
                right: 16px;
            }
        }

        /* Welcome message */
        .welcome-container {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c4622d;
            margin: 0 4px;
            animation: blink 1.4s infinite;
        }

        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        // Mini React-like UI system for ChatWidget only
        class ChatWidget {
            constructor() {
                this.open = false;
                this.messages = [
                    {
                        role: 'bot',
                        text: "Hello! I'm your CRM assistant. How can I help you today?"
                    }
                ];
                this.input = '';
                this.loading = false;
                this.apiBase = window.location.origin === 'http://localhost' 
                    ? 'http://localhost:8000'
                    : '/api';
                
                this.render();
                this.attachListeners();
            }

            render() {
                const root = document.getElementById('root');
                root.innerHTML = `
                    ${this.open ? this.renderWindow() : ''}
                    <button class="chat-fab" id="fab-btn" aria-label="${this.open ? 'Close' : 'Open'} chat">
                        ${this.open ? '✕' : 'Fe'}
                    </button>
                `;
                
                document.getElementById('fab-btn').addEventListener('click', () => this.toggleChat());
                
                if (this.open) {
                    this.attachChatListeners();
                    setTimeout(() => {
                        const messagesDiv = document.querySelector('.chat-messages');
                        if (messagesDiv) messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }, 0);
                }
            }

            renderWindow() {
                return `
                    <div class="chat-window" role="dialog" aria-label="Chat Assistant">
                        <div class="chat-header">
                            <div>
                                <div class="chat-header-title">CRM Assistant</div>
                                <div class="chat-header-sub">Chat Support</div>
                            </div>
                            <button class="btn-ghost" id="close-btn">✕</button>
                        </div>

                        <div class="chat-messages" id="messages">
                            ${this.messages.map((msg, i) => `
                                <div class="msg-row ${msg.role === 'user' ? 'msg-row-user' : ''}">
                                    ${msg.role === 'bot' ? '<div class="msg-avatar">Fe</div>' : ''}
                                    <div class="msg-bubble msg-${msg.role}">
                                        ${msg.text}
                                    </div>
                                </div>
                            `).join('')}
                            ${this.loading ? `
                                <div class="msg-row">
                                    <div class="msg-avatar">Fe</div>
                                    <div class="msg-bubble msg-bot">
                                        <span class="loading"></span>
                                        <span class="loading"></span>
                                        <span class="loading"></span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="chat-input-row">
                            <textarea 
                                id="input" 
                                placeholder="Type your message..." 
                                rows="1"
                                ${this.loading ? 'disabled' : ''}
                            ></textarea>
                            <button class="btn-primary" id="send-btn" ${this.loading || !this.input ? 'disabled' : ''}>
                                Send
                            </button>
                        </div>
                    </div>
                `;
            }

            attachChatListeners() {
                const input = document.getElementById('input');
                const sendBtn = document.getElementById('send-btn');
                const closeBtn = document.getElementById('close-btn');

                if (input) {
                    input.value = this.input;
                    input.addEventListener('input', (e) => {
                        this.input = e.target.value;
                        sendBtn.disabled = !this.input.trim() || this.loading;
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            this.sendMessage();
                        }
                    });

                    input.focus();
                }

                if (sendBtn) {
                    sendBtn.addEventListener('click', () => this.sendMessage());
                }

                if (closeBtn) {
                    closeBtn.addEventListener('click', () => this.toggleChat());
                }
            }

            async sendMessage() {
                if (!this.input.trim()) return;

                this.messages.push({ role: 'user', text: this.input });
                const userInput = this.input;
                this.input = '';
                this.loading = true;
                this.render();

                try {
                    const response = await fetch(`${this.apiBase}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userInput })
                    });

                    const data = await response.json();
                    this.messages.push({ 
                        role: 'bot', 
                        text: data.reply || 'Sorry, I could not process your request.' 
                    });
                } catch (err) {
                    this.messages.push({ 
                        role: 'bot', 
                        text: 'Sorry, I cannot connect to the server right now. Please try again.' 
                    });
                }

                this.loading = false;
                this.render();
            }

            toggleChat() {
                this.open = !this.open;
                this.render();
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            new ChatWidget();
        });
    </script>
</body>
</html>
